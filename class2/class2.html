<html lang="en">
<head>
    <meta charset="UTF-8">

<body>
    <div style="display: flex; flex-direction: column;align-items: center;height: 100vh;justify-content: center;">
        <h1>
            Calculator
        </h1>
        <div> 
            <label for="inputone"> First Input</label>
            <input type="number" placeholder="enter number one" id="inputone" required>
        </div><br>
        <div>
            <label for="inputtwo">Second Input</label>
            <input type="number" placeholder="enter number two" id="inputtwo" required>
        </div><br>
        <div>
            <button id="add">+</button>
            <button id="subtract">-</button>
            <button id="multiply">*</button>
            <button id="divide">/</button>
        </div><br>
        <div>
            <button>Calculate</button>
            <p>Output is: <span></span></p>

        </div>


    </div>
    
</body>
